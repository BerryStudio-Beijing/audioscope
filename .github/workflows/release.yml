name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S alpha -B alpha/build -DAUDIOSCOPE_PLATFORM=macos
      - name: Build
        run: cmake --build alpha/build --config Release
      - name: Test
        run: ctest --test-dir alpha/build --output-on-failure
      - name: Package
        run: |
          set -euo pipefail
          VERSION="$(cat alpha/VERSION)"
          mkdir -p stage
          cp alpha/build/audioscope-alpha stage/
          cp alpha/README.md alpha/KNOWN-ISSUES.md alpha/CHANGELOG.md alpha/VERSION stage/
          cd stage
          zip -qry "../AudioScope-${VERSION}-macos-arm64.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: AudioScope-*-macos-arm64.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S alpha -B alpha/build -DAUDIOSCOPE_PLATFORM=windows -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build alpha/build --config Release
      - name: Test
        run: ctest --test-dir alpha/build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content alpha/VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item alpha/build/Release/audioscope-alpha.exe stage/
          Copy-Item -Path alpha/README.md, alpha/KNOWN-ISSUES.md, alpha/CHANGELOG.md, alpha/VERSION -Destination stage/
          Compress-Archive -Path stage/* -DestinationPath "AudioScope-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: AudioScope-*-windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [ macos, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES="docs/release-notes/${TAG}.md"
          ARGS=(--repo "$GITHUB_REPOSITORY" --title "AudioScope by BerryStudio ${TAG#v}")
          if [ -f "$NOTES" ]; then
            ARGS+=(--notes-file "$NOTES")
          else
            ARGS+=(--generate-notes)
          fi
          if [[ "$TAG" == *alpha* ]]; then
            ARGS+=(--prerelease)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            if [[ "$TAG" == *alpha* ]]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
            fi
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt "${ARGS[@]}"
          fi
